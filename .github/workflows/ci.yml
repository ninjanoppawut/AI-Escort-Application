name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_ENV: preview
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_remote_credential
  RELEASE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.12.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.12.0
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local
      - run: npm run test:db
      - run: npx supabase db lint --local --schema public,private --level warning --fail-on error
      - run: npx supabase db advisors --local --type all --level warn --fail-on error
      - name: Verify generated database types
        run: |
          npx supabase gen types --local --schema public > /tmp/database.types.ts
          npx prettier --config prettier.config.mjs --write /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.12.0
      - run: npm ci
      - name: Start local Supabase and export browser-safe configuration
        shell: bash
        run: |
          npx supabase start
          npx supabase db reset --local

          status_file="$RUNNER_TEMP/supabase.env"
          npx supabase status -o env > "$status_file"

          read_env() {
            local line
            line="$(grep -m1 "^${1}=" "$status_file")"
            printf '%s' "${line#*=}" | tr -d '"'
          }

          api_url="$(read_env API_URL)"
          publishable_key="$(read_env PUBLISHABLE_KEY)"
          mailpit_url="$(read_env MAILPIT_URL)"

          if [[ -z "$api_url" || -z "$publishable_key" || -z "$mailpit_url" ]]; then
            echo "Local Supabase browser configuration is incomplete." >&2
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "MAILPIT_URL=$mailpit_url"
          } >> "$GITHUB_ENV"

          rm -f "$status_file"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=student-mobile-chromium --project=teacher-desktop-chromium
